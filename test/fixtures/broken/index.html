<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>broken fixture</title>
<style>
body{margin:0;font-family:"Nonexistent Grotesk",Georgia,serif;background:#fff;color:#222}
section{min-height:900px;padding:64px}
.faint{color:#c4c4c4}
.tiny{font-size:9px}
.wide{width:620px;height:80px;background:#e33}
.reveal{opacity:0;transform:translateY(40px);transition:opacity .6s,transform .6s}
.reveal.in{opacity:1;transform:none}
</style></head><body>
<section><h1>Broken fixture</h1><p class="faint">This grey text is too faint to read.</p><p class="tiny">tiny legal line</p><div class="wide"></div></section>
<section class="reveal"><h2>Revealed on scroll</h2><img src="missing-photo.jpg" alt="missing"></section>
<section class="reveal"><h2>Another reveal</h2></section>
<script>
const io=new IntersectionObserver(es=>es.forEach(e=>e.isIntersecting&&e.target.classList.add('in')));
document.querySelectorAll('.reveal').forEach(el=>io.observe(el));
</script></body></html>
