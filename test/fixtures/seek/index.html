<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}canvas{display:block}</style></head><body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
const g=document.getElementById('c').getContext('2d');
window.seek=(t)=>{g.fillStyle='#000';g.fillRect(0,0,1920,1080);g.fillStyle='#ffd60a';g.fillRect(Math.min(t/4,1)*1700,440,200,200);};
window.seek(0);
</script></body></html>
